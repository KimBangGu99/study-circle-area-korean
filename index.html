<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>원의 넓이 탐구</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#f2f4f6;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#182438}#board{background:linear-gradient(145deg,#d9dcde,#fafbfb 15%,#fff 75%,#e0e2e4);border:8px solid #878d93;border-radius:23px;padding:14px 15px 7px;box-shadow:inset 0 0 0 3px #c8cbce,0 7px 20px #0002;max-width:1400px;margin:auto}.top{display:flex;align-items:center;gap:9px;margin-bottom:10px}.heading{font-size:clamp(24px,3vw,35px);font-weight:900;background:linear-gradient(transparent 22%,#fff0aa 22%,#fff0aa 87%,transparent 87%);padding:0 12px;color:#15191e}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:10px;align-items:stretch}.stage{border:2px solid #e1e3e7;border-radius:18px;min-width:0;padding:5px;display:flex;flex-direction:column;justify-content:space-between;background:#ffffffc9}.drawing{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.drawing svg{width:100%;height:auto;max-height:570px;display:block}.stagefooter{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 6px;min-width:0}.stagecaption{font-size:clamp(20px,2.35vw,32px);font-weight:900;color:#132d44;letter-spacing:-1.5px;min-width:0;line-height:1.3;white-space:nowrap}.controls{display:flex;flex-direction:column;gap:10px;min-width:0}.panel{border:2px solid #cdd8d2;border-radius:18px;padding:13px 10px;background:#fff;min-width:0}.label{display:inline-block;background:linear-gradient(transparent 15%,#fff0a9 15%,#fff0aa 88%,transparent 88%);font-weight:900;font-size:19px;padding:0 4px;margin-bottom:12px}.count{border:2px solid #0b7449;border-radius:16px;text-align:center;padding:10px 6px;font-size:43px;font-weight:900;color:#075c37;background:#f0faf4;margin-bottom:15px;box-shadow:0 3px 0 #c8e4d4}input[type=range]{width:100%;appearance:none;-webkit-appearance:none;cursor:pointer;height:13px;border-radius:20px;background:#e4e9e6;margin:12px 0 10px}input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:6px solid #087b4a;box-shadow:0 2px 6px #0003}input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:#fff;border:6px solid #087b4a}.rangeLabels{display:flex;justify-content:space-between;font-size:15px;font-weight:900;color:#173d2e;margin-top:4px}.presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:14px}button{font-family:inherit;font-weight:900;cursor:pointer;border:2px solid #d9dce0;border-radius:12px;background:#fafafa;color:#1c2b40;padding:10px 2px;font-size:13px;touch-action:manipulation}.presets button{border-color:#b7c9bf;background:#f8fbf9;color:#174b35;min-height:47px;font-size:14px}.presets button.active{background:#087b4a;border-color:#087b4a;color:white;box-shadow:0 3px 0 #055c37}button:focus-visible,input:focus-visible{outline:3px solid #4b93e9;outline-offset:3px}.modeButtons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modeButtons button{min-height:66px;font-size:14px;line-height:1.4;padding:8px 5px;word-break:keep-all}.modeButtons button.active{background:#126c42;border-color:#126c42;color:white}.download{background:#dcefff;border-color:#6aaef4;color:#153e65;width:42px;height:38px;min-width:42px;padding:7px;display:grid;place-items:center;flex-shrink:0}.download svg{width:21px;height:21px}.tray{height:17px;border-bottom:5px solid #aeb3b7;display:flex;justify-content:flex-end;align-items:end;gap:10px;padding-right:25px;margin-top:7px}.marker{width:43px;height:9px;border-radius:3px;background:#f25a5a;border-left:8px solid #b83737}.marker.blue{background:#5961f7;border-left-color:#3039b6}.eraser{width:65px;height:15px;border-radius:6px 6px 1px 1px;background:#484e56}/* 패드에서도 원 탐구 영역과 조절 영역을 항상 좌우로 배치 */
@media(max-width:850px){
 body{padding:7px}
 #board{padding:11px 9px 6px;border-width:6px}
 .layout{grid-template-columns:minmax(0,1fr) 220px;gap:8px}
 .controls{display:flex;flex-direction:column;gap:8px}
 .panel{padding:10px 7px}
 .stagecaption{font-size:clamp(13px,2.4vw,23px);letter-spacing:-1px}
 .heading{font-size:clamp(23px,3.5vw,32px)}
 .modeButtons button{font-size:12px;padding:7px 2px}
}
@media(max-width:600px){
 /* 작은 화면에서는 가로 스크롤을 허용해 조작 버튼과 도형 크기를 보존 */
 #board{min-width:660px}
 .layout{grid-template-columns:minmax(0,1fr) 220px}
 .stagecaption{font-size:18px}
}
</style></head><body><main id="board"><div class="top"><span style="color:#fa704b;font-size:25px">✦</span><span class="heading">원의 넓이 탐구</span><span style="color:#fa704b;font-size:25px">✦</span></div><div class="layout"><section class="stage"><div class="drawing"><svg viewBox="0 0 720 510" preserveAspectRatio="xMidYMid meet" role="img" aria-label="원 조각의 모습"><g id="pieces"></g></svg></div><div class="stagefooter"><span id="caption" class="stagecaption">원의 조각 수를 바꾸어 보세요.</span><button id="download" class="download" title="이미지 다운로드" aria-label="배열 이미지 다운로드"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></button></div></section><aside class="controls"><section class="panel"><div class="label">원의 조각 수</div><div class="count"><span id="count">16</span>개</div><input id="slider" type="range" min="4" max="240" step="2" value="16" aria-label="원의 조각 수 조절"><div class="rangeLabels"><span>4개</span><span>240개</span></div><div class="presets"><button data-n="8">8개</button><button data-n="16" class="active">16개</button><button data-n="32">32개</button><button data-n="64">64개</button></div></section><section class="panel"><div class="label">모양 살펴보기</div><div class="modeButtons"><button id="circle" class="active">◯ 원 관찰하기</button><button id="arrange">▱ 조각 배열하기</button></div></section></aside></div><div class="tray"><span class="marker"></span><span class="marker blue"></span><span class="eraser"></span></div></main>
<script>
(()=>{const $=s=>document.querySelector(s),ns='http://www.w3.org/2000/svg';let n=16,mode='circle',pieces=[],poses=[],frame=0,token=0;const g=$('#pieces'),RED='#f25a5a',BLUE='#5961f7';
function wedge(){const h=Math.PI/n;return `M0 0 L${Math.cos(-h)} ${Math.sin(-h)} A1 1 0 0 1 ${Math.cos(h)} ${Math.sin(h)} Z`}
function layout(m){if(m==='circle')return Array.from({length:n},(_,i)=>({x:360,y:255,r:249,a:-Math.PI/2+(i+.5)*Math.PI*2/n}));const h=Math.PI/n,R=Math.min(236,690/(n*Math.sin(h))),dx=R*Math.sin(h),dy=R*Math.cos(h);return Array.from({length:n},(_,i)=>({x:360+(i-(n-1)/2)*dx,y:255+(i%2===0?dy/2:-dy/2),r:R,a:i%2===0?-Math.PI/2:Math.PI/2}))}
function mat(p){const c=Math.cos(p.a)*p.r,s=Math.sin(p.a)*p.r;return `matrix(${c},${s},${-s},${c},${p.x},${p.y})`}
function draw(){pieces.forEach((p,i)=>p.setAttribute('transform',mat(poses[i])))}
function color(i){return mode==='circle'?(i<n/4||i>=3*n/4?RED:BLUE):(i%2===0?RED:BLUE)}
function recolor(){pieces.forEach((p,i)=>{p.setAttribute('fill',color(i));p.setAttribute('stroke',mode==='circle'?'#111':'none');p.setAttribute('stroke-width',mode==='circle'?'0.012':'0');p.setAttribute('stroke-linejoin','round')})}
function rebuild(){cancelAnimationFrame(frame);token++;g.replaceChildren();pieces=[];poses=layout(mode);const d=wedge();for(let i=0;i<n;i++){const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('stroke','none');g.appendChild(p);pieces.push(p)}recolor();draw()}
function change(m){if(mode===m)return;cancelAnimationFrame(frame);const id=++token,from=poses.map(p=>({...p}));mode=m;const to=layout(m),start=performance.now();$('#circle').classList.toggle('active',m==='circle');$('#arrange').classList.toggle('active',m==='arranged');$('#caption').textContent=m==='circle'?'원의 조각 수를 바꾸어 보세요.':'조각 수가 많아질수록 어떤 도형이 되나요?';recolor();function tick(now){if(id!==token)return;const t=Math.min(1,(now-start)/900),e=t*t*(3-2*t);poses=from.map((p,i)=>({x:p.x+(to[i].x-p.x)*e,y:p.y+(to[i].y-p.y)*e,r:p.r+(to[i].r-p.r)*e,a:p.a+(to[i].a-p.a)*e}));draw();if(t<1)frame=requestAnimationFrame(tick);else{poses=to;draw()}}frame=requestAnimationFrame(tick)}
function setN(v){n=Math.max(4,Math.min(240,Math.round(+v/2)*2));$('#slider').value=n;$('#count').textContent=n;const t=(n-4)/236*100;$('#slider').style.background=`linear-gradient(to right,#087b4a 0%,#087b4a ${t}%,#e4e9e6 ${t}%,#e4e9e6 100%)`;document.querySelectorAll('[data-n]').forEach(b=>b.classList.toggle('active',+b.dataset.n===n));rebuild()}
function exportImage(){
 // 원과 조각 배열을 한 장에 위아래로 저장합니다.
 const canvas=document.createElement('canvas'),W=1400,H=1600;
 canvas.width=W;canvas.height=H;
 const c=canvas.getContext('2d');
 c.fillStyle='#fcfdfd';c.fillRect(0,0,W,H);
 c.strokeStyle='#d9dee1';c.lineWidth=10;c.strokeRect(12,12,W-24,H-24);
 c.textAlign='center';c.fillStyle='#202936';
 c.font="bold 56px 'Malgun Gothic',sans-serif";
 c.fillText(`원의 조각 수: ${n}개`,W/2,100);
 c.font="bold 38px 'Malgun Gothic',sans-serif";
 c.fillText('원 관찰하기',W/2,188);
 c.fillText('조각 배열하기',W/2,925);
 c.strokeStyle='#e2e6e9';c.lineWidth=3;
 c.beginPath();c.moveTo(100,830);c.lineTo(W-100,830);c.stroke();
 function paint(m,cx,cy,scale){
  const ps=layout(m),h=Math.PI/n;
  c.save();c.translate(cx,cy);c.scale(scale,scale);c.translate(-360,-255);
  for(let i=0;i<n;i++){
   const p=ps[i];c.beginPath();c.moveTo(p.x,p.y);
   c.lineTo(p.x+p.r*Math.cos(p.a-h),p.y+p.r*Math.sin(p.a-h));
   c.arc(p.x,p.y,p.r,p.a-h,p.a+h);c.closePath();
   c.fillStyle=m==='circle'?(i<n/4||i>=3*n/4?RED:BLUE):(i%2===0?RED:BLUE);
   c.fill();
   if(m==='circle'){c.strokeStyle='#111';c.lineWidth=1.15;c.lineJoin='round';c.stroke();}
  }
  c.restore();
 }
 // 첫 번째 그림은 지름 약 530px로 작게, 두 번째는 아래쪽에 배치합니다.
 paint('circle',W/2,505,265/249);
 paint('arranged',W/2,1230,1.65);
 const filename=`원의_조각_배열_${n}개.png`;
 const dataURL=canvas.toDataURL('image/png');
 const isiPad=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(isiPad){
  const binary=atob(dataURL.split(',')[1]);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const file=new File([bytes],filename,{type:'image/png'});
  if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
   try{
    const sharing=navigator.share({files:[file]});
    Promise.resolve(sharing).catch(err=>{if(err.name!=='AbortError')showImagePreview(dataURL,filename)});
    return;
   }catch(e){}
  }
  showImagePreview(dataURL,filename);
  return;
 }
 const a=document.createElement('a');a.download=filename;a.href=dataURL;
 document.body.appendChild(a);a.click();a.remove();
}
function showImagePreview(dataURL,filename){
 let overlay=document.getElementById('iosImagePreview');
 if(!overlay){
  overlay=document.createElement('div');overlay.id='iosImagePreview';
  overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(14,25,35,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:18px;';
  const info=document.createElement('div');info.style.cssText='color:white;font:600 16px sans-serif;text-align:center;line-height:1.5';info.textContent='이미지를 길게 누른 뒤 ‘사진에 저장’을 선택하세요.';
  const img=document.createElement('img');img.style.cssText='display:block;max-width:100%;max-height:73vh;object-fit:contain;background:white;border-radius:8px';img.alt='저장할 원의 넓이 탐구 이미지';
  const close=document.createElement('button');close.type='button';close.textContent='닫기';close.style.cssText='background:white;color:#183e2d;border:0;border-radius:10px;padding:12px 34px;font-size:17px;font-weight:700';close.onclick=()=>overlay.remove();
  overlay.append(info,img,close);document.body.appendChild(overlay);
 }
 overlay.querySelector('img').src=dataURL;
 overlay.querySelector('img').alt=filename;
}
$('#slider').addEventListener('input',e=>setN(e.target.value));document.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>setN(b.dataset.n)));$('#circle').addEventListener('click',()=>change('circle'));$('#arrange').addEventListener('click',()=>change('arranged'));$('#download').addEventListener('click',exportImage);setN(16)})();
</script></body></html>
